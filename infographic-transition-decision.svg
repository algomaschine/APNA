<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" width="580" height="360" font-family="Times New Roman, Times, serif">
  <defs>
    <linearGradient id="decBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fafafa"/>
    </linearGradient>
    <linearGradient id="det" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="rand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed"/>
      <stop offset="100%" style="stop-color:#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="580" height="360" fill="url(#decBg)"/>
  <text x="290" y="28" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="700">Transition Decision (Step 2)</text>
  <text x="290" y="46" text-anchor="middle" fill="#1a1a1a" font-size="10">On tick or trigger: how next_state is chosen</text>

  <rect x="190" y="62" width="200" height="36" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="290" y="84" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="600">Tick (every T min) or Attack signal</text>

  <line x1="290" y1="98" x2="290" y2="124" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M287 124 L290 128 L293 124 Z" fill="#1a1a1a"/>

  <!-- Diamond: extra space so labels don't overlap -->
  <path d="M290 132 L378 198 L290 264 L202 198 Z" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="290" y="192" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="700">Choose mode</text>
  <text x="290" y="206" text-anchor="middle" fill="#1a1a1a" font-size="9">deterministic vs unpredictable</text>

  <line x1="202" y1="198" x2="108" y2="198" stroke="#0f766e" stroke-width="2"/>
  <path d="M104 198 L108 194 L108 202 Z" fill="#0f766e"/>
  <text x="140" y="192" fill="#0f766e" font-size="9" font-weight="600">deterministic</text>
  <rect x="20" y="218" width="176" height="92" rx="6" fill="url(#det)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="108" y="240" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">Cycle</text>
  <text x="108" y="258" text-anchor="middle" fill="#1a1a1a" font-size="9">next_state =</text>
  <text x="108" y="276" text-anchor="middle" fill="#1a1a1a" font-size="10" font-family="Courier New, monospace">(current + 1) mod N</text>
  <text x="108" y="298" text-anchor="middle" fill="#1a1a1a" font-size="8">No extra entropy</text>

  <line x1="378" y1="198" x2="472" y2="198" stroke="#c2410c" stroke-width="2"/>
  <path d="M476 198 L472 194 L472 202 Z" fill="#c2410c"/>
  <text x="418" y="192" fill="#c2410c" font-size="9" font-weight="600">unpredictable</text>
  <rect x="384" y="218" width="176" height="92" rx="6" fill="url(#rand)" stroke="#c2410c" stroke-width="1.5"/>
  <text x="472" y="240" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="700">Random</text>
  <text x="472" y="258" text-anchor="middle" fill="#1a1a1a" font-size="9">next_state =</text>
  <text x="472" y="276" text-anchor="middle" fill="#1a1a1a" font-size="10" font-family="Courier New, monospace">secure_random(0,N-1)</text>
  <text x="472" y="298" text-anchor="middle" fill="#1a1a1a" font-size="8">Entropy: OS / HSM / QRNG</text>

  <line x1="290" y1="264" x2="290" y2="298" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M287 298 L290 302 L293 298 Z" fill="#1a1a1a"/>
  <rect x="200" y="302" width="180" height="36" rx="6" fill="#e0f2fe" stroke="#1e40af"/>
  <text x="290" y="322" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="700">next_state to Step 3</text>
</svg>
