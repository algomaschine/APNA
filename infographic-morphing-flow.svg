<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" font-family="Times New Roman, Times, serif">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fafafa"/>
    </linearGradient>
    <linearGradient id="stepFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8faf8"/>
    </linearGradient>
    <linearGradient id="stepTrigger" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8fc"/>
      <stop offset="100%" style="stop-color:#f0eef5"/>
    </linearGradient>
  </defs>
  <rect width="520" height="620" fill="url(#flowBg)"/>
  <text x="260" y="26" text-anchor="middle" fill="#1a1a1a" font-size="17" font-weight="700">Morphing Algorithm: Exact Flow</text>
  <text x="260" y="44" text-anchor="middle" fill="#1a1a1a" font-size="10">Orchestrator loop (software only)</text>

  <!-- Step 1 -->
  <rect x="50" y="56" width="420" height="52" rx="6" fill="url(#stepFill)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="260" y="78" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">1. State model</text>
  <text x="260" y="96" text-anchor="middle" fill="#1a1a1a" font-size="9">VNI-VLAN map, BGP path roles, ACLs (YAML/Jinja2)</text>

  <line x1="260" y1="108" x2="260" y2="128" stroke="#0f766e" stroke-width="2"/>
  <path d="M257 128 L260 132 L263 128 Z" fill="#0f766e"/>

  <!-- Step 2 -->
  <rect x="50" y="132" width="420" height="52" rx="6" fill="url(#stepFill)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="260" y="154" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">2. Transition decision</text>
  <text x="260" y="172" text-anchor="middle" fill="#1a1a1a" font-size="9">Tick or trigger: cycle (A-B-C) or secure_random(0, N-1)</text>

  <line x1="260" y1="184" x2="260" y2="204" stroke="#0f766e" stroke-width="2"/>
  <path d="M257 204 L260 208 L263 204 Z" fill="#0f766e"/>

  <!-- Step 3 -->
  <rect x="50" y="208" width="420" height="52" rx="6" fill="url(#stepFill)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="260" y="230" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">3. Config generation</text>
  <text x="260" y="248" text-anchor="middle" fill="#1a1a1a" font-size="9">Device configs (Arista/Juniper): EVPN-VXLAN, BGP, ACLs</text>

  <line x1="260" y1="260" x2="260" y2="280" stroke="#0f766e" stroke-width="2"/>
  <path d="M257 280 L260 284 L263 280 Z" fill="#0f766e"/>

  <!-- Step 4 -->
  <rect x="50" y="284" width="420" height="52" rx="6" fill="url(#stepFill)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="260" y="306" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">4. Apply order</text>
  <text x="260" y="324" text-anchor="middle" fill="#1a1a1a" font-size="9">Spines then leaves via Ansible / eAPI / NETCONF</text>

  <line x1="260" y1="336" x2="260" y2="356" stroke="#0f766e" stroke-width="2"/>
  <path d="M257 356 L260 360 L263 356 Z" fill="#0f766e"/>

  <!-- Step 5 -->
  <rect x="50" y="360" width="420" height="52" rx="6" fill="url(#stepFill)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="260" y="382" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">5. Verification</text>
  <text x="260" y="400" text-anchor="middle" fill="#1a1a1a" font-size="9">Check BGP/EVPN convergence; update state, schedule next</text>

  <line x1="260" y1="412" x2="260" y2="432" stroke="#0f766e" stroke-width="2"/>
  <path d="M257 432 L260 436 L263 432 Z" fill="#0f766e"/>

  <!-- Step 6 (optional path) - violet accent -->
  <rect x="50" y="436" width="420" height="52" rx="6" fill="url(#stepTrigger)" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="260" y="458" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="700">6. Attack-triggered morph (optional)</text>
  <text x="260" y="476" text-anchor="middle" fill="#1a1a1a" font-size="9">DDoS/IDS signal: shorten interval or immediate transition</text>

  <!-- Loop back: path does not cross label - label sits in clear space below path -->
  <path d="M 260 488 L 260 498 L 420 498 L 420 158 L 470 158" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M466 154 L470 158 L466 162 Z" fill="#1a1a1a"/>
  <text x="340" y="492" text-anchor="middle" fill="#1a1a1a" font-size="10" font-weight="600">back to step 2</text>
</svg>
